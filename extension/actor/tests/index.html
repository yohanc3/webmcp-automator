<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actor runtime tests</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; }
      #sandbox { border: 1px solid #ddd; min-height: 80px; padding: 12px; }
      #sandbox > *, #sandbox article > * { min-height: 2px; }
      .hidden { display: none; }
      .pass { color: #08752c; }
      .fail { color: #b42318; }
    </style>
    <script src="../runtime.js"></script>
    <script src="runtime.test.js" defer></script>
  </head>
  <body>
    <h1>Actor runtime tests</h1>
    <p id="summary">Running…</p>
    <div id="sandbox"></div>
    <h2>Storefront fixture result</h2><pre id="fixture-result">Pending</pre>
    <ol id="results"></ol>
    <details><summary>Protocol outcomes</summary><pre id="outcomes"></pre></details>
  </body>
</html>
